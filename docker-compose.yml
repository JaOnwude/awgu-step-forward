services:
  db:
    image: postgres:16-alpine
    container_name: awgu-db
    environment:
      POSTGRES_USER: awgu
      POSTGRES_PASSWORD: awgu
      POSTGRES_DB: awgu
    ports:
      - "5432:5432"
    volumes:
      - awgu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awgu -d awgu"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  awgu_pgdata:
